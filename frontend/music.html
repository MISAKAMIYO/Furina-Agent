            raw.splice(to, 0, movedRaw);
        }
        renderList(songs, { source: 'local', draggable: true });
        markActive();
        fetch('/api/music/playlist/save', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ songs: raw })
        }).then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.success) toast('顺序已保存'); else toast('顺序保存失败');
        }).catch(function () { toast('顺序保存失败'); });
    }

    /* ── 歌单管理 ──────────────────────────── */
    var plState = { items: [], currentPath: '', currentName: '' };

    function loadPlaylists() {
        state.source = 'playlists';
        setTitle('我的歌单');
        $('account').innerHTML = '<span class="chip primary" onclick="__createPlaylist()">＋ 新建歌单</span>';
        $('content').innerHTML = '<div class="loading">读取歌单…</div>';
        fetch('/api/music/playlist/list').then(function (r) { return r.json(); }).then(function (d) {
            if (state.source !== 'playlists') return;
            plState.items = (d && d.playlists) || [];
            renderPlaylistsManager();
        }).catch(function () { $('content').innerHTML = '<div class="empty">读取失败</div>'; });
    }

    function renderPlaylistsManager() {
        var box = $('content');
        if (!plState.items.length) {
            box.innerHTML = '<div class="empty">还没有歌单，点右上角新建</div>';
            return;
        }
        box.innerHTML = '<div class="section-title">共 ' + plState.items.length + ' 个歌单</div>' +
            plState.items.map(function (p, i) {
                return '<div class="pl-row' + (p.is_current ? ' on' : '') + '">' +
                    '<span class="pl-name">' + esc(p.name) + '</span>' +
                    (p.is_current ? '<span class="pl-badge">当前</span>' : '') +
                    '<span class="pl-count">' + (p.count || 0) + ' 首</span>' +
                    '<button class="pl-act" onclick="__openPl(' + i + ')">打开</button>' +
                    '<button class="pl-act" onclick="__renamePl(' + i + ')">重命名</button>' +
                    '<button class="pl-act danger" onclick="__deletePl(' + i + ')">删除</button>' +
                    '</div>';
            }).join('');
    }

    function askName(title, value, cb) {
        var mask = $('name-modal');
        $('name-modal-title').textContent = title;
        var input = $('name-modal-input');
        input.value = value || '';
        mask.classList.add('open');
        setTimeout(function () { input.focus(); input.select(); }, 50);
        state.pendingName = cb;
        input.onkeydown = function (e) {
            if (e.key === 'Enter') { e.preventDefault(); confirmName(); }
            else if (e.key === 'Escape') closeName();
        };
    }
    function closeName() {
        $('name-modal').classList.remove('open');
        state.pendingName = null;
    }
    function confirmName() {
        var val = ($('name-modal-input').value || '').trim();
        var cb = state.pendingName;
        closeName();
        if (val && cb) cb(val);
    }

    function createPlaylist() {
        askName('新建歌单', '', function (name) {
            fetch('/api/music/playlist/create', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            }).then(function (r) { return r.json(); }).then(function (d) {
                if (d && d.success === false) toast(d.message || '创建失败');
                else { toast('已创建：' + name); loadPlaylists(); }
            });
        });
    }

    function openPl(i) {
        var p = plState.items[i];
        if (!p) return;
        fetch('/api/music/playlist/switch', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filepath: p.filepath })
        }).then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.success === false) { toast(d.message || '切换失败'); return; }
            plState.currentPath = p.filepath;
            plState.currentName = p.name;
            state.source = 'local';
            setTitle(p.name);
            renderAccount();
            loadLocalSongs(p.name);
        });
    }

    function renamePl(i) {
        var p = plState.items[i];
        if (!p) return;
        askName('重命名歌单', p.name, function (name) {
            fetch('/api/music/playlist/rename', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filepath: p.filepath, name: name })
            }).then(function (r) { return r.json(); }).then(function (d) {
                if (d && d.success === false) toast(d.message || '重命名失败');
                else { toast('已重命名'); loadPlaylists(); }
            });
        });
    }

    function deletePl(i) {
        var p = plState.items[i];
        if (!p) return;
        if (!confirm('删除歌单「' + p.name + '」？（只删歌单，不删歌曲文件）')) return;
        fetch('/api/music/playlist/delete', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filepath: p.filepath })
        }).then(function (r) { return r.json(); }).then(function (d) {
            if (d && d.success === false) toast(d.message || '删除失败');
            else { toast('已删除歌单'); loadPlaylists(); }
        });
    }

    /* ── 登录入口 ──────────────────────────── */
    function loginKugou() { renderLoginCard('kugou', function () { loadKugou(); }); }
    function loginNetease() { renderLoginCard('网易云', function () { loadNetease(); }); }
    function renderNeteaseLogin() { $('content').innerHTML = '<div class="empty">未登录，点右上角「登录网易云」</div>'; }
    function logoutKugou() {
        fetch('/api/kugou/logout', { method: 'POST' }).then(function () { toast('已退出酷狗'); loadKugou(); });
    }
    function logoutNetease() {
        fetch('/api/netease/logout', { method: 'POST' }).then(function () { toast('已退出网易云'); loadNetease(); });
    }

    /* ── 对外暴露 ──────────────────────────── */
    window.__player = { audio: audio, state: state };
    window.__play = play;
    window.__pollCommand = pollCommand;
    window.__cmdInfo = function () { return { seq: _cmdSeq }; };
    window.__ctxAdd = ctxAdd;
    window.__ctxPick = ctxPick;
    window.__setLyricMode = setLyricMode;
    window.__lyricSearch = lyricSearch;
    window.__lyricUse = lyricUse;
    window.__closeLyric = closeLyricModal;
    window.__loadRecommend = loadRecommend;
    window.__createPlaylist = createPlaylist;
    window.__openPl = openPl;
    window.__renamePl = renamePl;
    window.__deletePl = deletePl;
    window.__closeName = closeName;
    window.__confirmName = confirmName;
    window.__openPlaylist = openPlaylist;
    window.__refreshLocal = function () { loadLocal(); };
    window.__loginKugou = loginKugou;
    window.__loginNetease = loginNetease;
    window.__logoutKugou = logoutKugou;
    window.__logoutNetease = logoutNetease;
    window.__cancelLogin = function () { stopQR(); if (state.source === 'kugou') loadKugou(); else loadNetease(); };

    /* ── 初始化 ────────────────────────────── */
    document.querySelectorAll('.rail-btn[data-src]').forEach(function (b) {
        b.onclick = function () { switchSource(b.dataset.src); };
    });
    $('search-btn').onclick = doSearch;
    $('search-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') doSearch();
    });
    bindBar();
    initAppbar();
    bindDragSort();
    $('content').addEventListener('contextmenu', function (e) {
        var row = e.target.closest('.row');
        if (!row) return;
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, parseInt(row.dataset.i, 10) || 0);
    });
    setInterval(pollCommand, 800);
    try { if (localStorage.getItem('musicCompact') === '1') document.querySelector('.app').classList.add('compact'); } catch (e) {}
    initTheme();
    initShortcuts();
    var coverBig = $('cover-big');
    if (coverBig) coverBig.addEventListener('click', function () { toggleZen(); });
    document.querySelector('.zen-hint').addEventListener('click', function () { toggleZen(false); });
    loadLocal();
})();
</script>
<script src="/static/js/qrcode.min.js"></script>
